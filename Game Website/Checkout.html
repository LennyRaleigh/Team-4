<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>

    <!-- Link to the external CSS file that styles this page -->
    <link rel="stylesheet" href="Checkout.css">

</head>

<body>

    <!-- Navigation dropdown menu fixed to the top-right corner -->
    <div class="dropdown">

        <!-- Button that opens the dropdown when clicked -->
        <button class="dropbtn">▼</button>

        <!-- The list of links that appears when the dropdown opens -->
        <div class="dropdown-content">

            <a href="HomePage.html">Home</a>
            <a href="AboutUs.html">About Us</a>
            <a href="ContactUs.html">Contact Us</a>
            <a href="Gameplay.html">Gameplay</a>
            <a href="Merch.html">Merch</a>

        </div>

    </div>

    <!-- Page heading -->
    <h1><u>Checkout</u></h1>

    <!-- Wrapper that holds both the order summary and the delivery form side by side -->
    <div class="checkout-container">

        <!-- Left box: shows the items in the cart and the total price -->
        <div class="order-section">

            <h2>Your Order</h2>

            <!-- JavaScript fills this div with the cart items -->
            <div id="orderProducts"></div>

            <!-- Total price row shown at the bottom of the order summary -->
            <div class="total">

                <h3>
                    Total:
                    €<span id="totalPrice">0.00</span>
                </h3>

            </div>

        </div>

        <!-- Right box: form for delivery address and payment details -->
        <div class="details-section">

            <h2>Delivery Details</h2>

            <!-- Checkout form - JavaScript listens for the submit event -->
            <form id="checkoutForm">

                <!-- Full name input -->
                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <!-- Email input -->
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <!-- Street address input -->
                <label for="address">
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    required
                >

                <!-- City input -->
                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    required
                >

                <!-- Postcode / Eircode input -->
                <label for="postcode">
                    Eircode / Postcode
                </label>

                <input
                    type="text"
                    id="postcode"
                    name="postcode"
                    required
                >

                <!-- Payment section heading -->
                <h2>Payment</h2>

                <!-- Card number input - limited to 19 characters (16 digits + 3 spaces) -->
                <label for="card">
                    Card Number
                </label>

                <input
                    type="text"
                    id="card"
                    name="card"
                    placeholder="1234 5678 9012 3456"
                    maxlength="19"
                    required
                >

                <!-- Expiry date and CVV sit side by side in one row -->
                <div class="card-details">

                    <!-- Expiry date input -->
                    <div>

                        <label for="expiry">
                            Expiry Date
                        </label>

                        <input
                            type="text"
                            id="expiry"
                            name="expiry"
                            placeholder="MM/YY"
                            required
                        >

                    </div>

                    <!-- CVV input - limited to 3 digits -->
                    <div>

                        <label for="cvv">
                            CVV
                        </label>

                        <input
                            type="text"
                            id="cvv"
                            name="cvv"
                            placeholder="123"
                            maxlength="3"
                            required
                        >

                    </div>

                </div>

                <!-- Submit button - triggers the form submit event in JavaScript -->
                <button type="submit" class="pay-button">
                    Place Order
                </button>

            </form>

        </div>

    </div>

    <!-- Link to the JavaScript file that loads cart items and handles the form -->
    <script src="Checkout.js"></script>

</body>

</html>
