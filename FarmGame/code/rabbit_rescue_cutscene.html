    background-position: center;
  }

  .sprite {
    position: absolute;
    image-rendering: pixelated;
    transition: left 1.3s ease-in-out, transform 0.4s ease, opacity 0.6s ease, bottom 0.6s ease, top 0.6s ease;
  }
  #farmer {
    width: 66px; height: 66px;
    bottom: 12%;
    left: 260px;
    z-index: 5;
  }
  .rabbit {
    width: 40px; height: 46px;
    bottom: 11%;
    z-index: 4;
  }
  .rabbit.baby {
    width: 24px; height: 28px;
  }
  #papa {
    width: 46px; height: 52px;
  }
  #basket {
    position: absolute;
    width: 46px; height: 34px;
    bottom: 12%;
    background: #9b6b3c;
    border: 3px solid #7a5029;
    border-radius: 4px 4px 8px 8px;
    z-index: 6;
  }
  #basket::before {
    content: '';
    position: absolute;
    top: -10px; left: 6px;
    width: 30px; height: 10px;
    border: 3px solid #7a5029;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
  }

  #stars {
    position: absolute;
    width: 60px;
    text-align: center;
    font-size: 20px;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 12;
    pointer-events: none;
  }
  #stars.show { opacity: 1; animation: spin 1.2s linear infinite; }
  @keyframes spin {
    0% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(180deg) translateY(-4px); }
    100% { transform: rotate(360deg) translateY(0); }
  }

  .bubble {
    position: absolute;
    background: var(--box);
    border: 2px solid var(--box-border);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 11px;
    color: var(--text);
    white-space: nowrap;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 10;
  }
  .bubble.show { opacity: 1; transform: translateY(0); }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 16px;
    border-width: 8px 6px 0 6px;
    border-style: solid;
    border-color: var(--box-border) transparent transparent transparent;
  }
  .bubble::before {
    content: '';
    position: absolute;
    bottom: -5px; left: 18px;
    border-width: 6px 4px 0 4px;
    border-style: solid;
    border-color: var(--box) transparent transparent transparent;
    z-index: 1;
  }

  #caption-bar {
    position: absolute;
    bottom: 0; left: 0; width: 100%;
    min-height: 54px;
    background: rgba(20,15,10,0.88);
    border-top: 3px solid #000;
    color: #fdf6e3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    font-size: 13px;
    text-align: center;
    letter-spacing: 0.3px;
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: 20;
  }
  #caption-bar.show { opacity: 1; }

  #skip {
    position: absolute;
    top: 8px; right: 10px;
    z-index: 30;
    background: rgba(0,0,0,0.5);
    color: #fdf6e3;
    border: 1px solid #fdf6e3;
    border-radius: 4px;
    font-size: 10px;
    padding: 4px 8px;
    cursor: pointer;
    font-family: inherit;
    opacity: 0.8;
  }
  #skip:hover { opacity: 1; }

  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
    z-index: 25;
  }

  #fade {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 40;
  }
  #fade.on { opacity: 1; }

  #replay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    z-index: 50;
    background: #fdf6e3;
    border: 2px solid var(--box-border);
    border-radius: 6px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #replay.show { opacity: 1; pointer-events: auto; }
</style>
</head>

  <div id="bubble-farmer" class="bubble" style="left:0px; bottom:0px;"></div>
  <div id="bubble-rabbit" class="bubble" style="left:0px; bottom:0px;"></div>

  <div id="caption-bar"></div>
  <div id="vignette"></div>
  <div id="fade"></div>
  <button id="replay">&#8635; Replay</button>
  <button id="skip">Skip &#9654;&#9654;</button>

<script>
const farmer = document.getElementById('farmer');
const mom = document.getElementById('mom');
const baby1 = document.getElementById('baby1');
const baby2 = document.getElementById('baby2');
const baby3 = document.getElementById('baby3');
const papa = document.getElementById('papa');
const basket = document.getElementById('basket');
const stars = document.getElementById('stars');
const bubbleFarmer = document.getElementById('bubble-farmer');
const bubbleRabbit = document.getElementById('bubble-rabbit');
const captionBar = document.getElementById('caption-bar');
const fade = document.getElementById('fade');
const replayBtn = document.getElementById('replay');
const skipBtn = document.getElementById('skip');

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function caption(text) {
  captionBar.textContent = text;
  captionBar.classList.add('show');
}
function hideCaption() {
  captionBar.classList.remove('show');
}

function say(bubbleEl, targetEl, text, offsetX, offsetY) {
  const stageRect = document.getElementById('stage').getBoundingClientRect();
  const r = targetEl.getBoundingClientRect();
  const left = r.left - stageRect.left + offsetX;
  const top = r.top - stageRect.top + offsetY;
  bubbleEl.style.left = left + 'px';
  bubbleEl.style.top = top + 'px';
  bubbleEl.textContent = text;
  bubbleEl.classList.add('show');
}
function hideBubble(bubbleEl) {
  bubbleEl.classList.remove('show');
}

function positionStars(targetEl) {
  const stageRect = document.getElementById('stage').getBoundingClientRect();
  const r = targetEl.getBoundingClientRect();
  const left = r.left - stageRect.left + (r.width / 2) - 30;
  const top = r.top - stageRect.top - 26;
  stars.style.left = left + 'px';
  stars.style.top = top + 'px';
}

let sequenceToken = 0;

async function playSequence() {
  const myToken = ++sequenceToken;
  const stillCurrent = () => myToken === sequenceToken;

  // reset
  fade.classList.remove('on');
  replayBtn.classList.remove('show');
  hideCaption();
  hideBubble(bubbleFarmer);
  hideBubble(bubbleRabbit);
  stars.classList.remove('show');

  [farmer, mom, baby1, baby2, baby3, papa, basket].forEach(el => el.style.transition = 'none');
  farmer.style.left = '260px';
  farmer.style.transform = 'scaleX(1)';
  farmer.style.top = '';
  farmer.style.bottom = '12%';
  basket.style.left = '150px';
  mom.style.left = '148px'; mom.style.bottom = '12%'; mom.style.opacity = '0.95'; mom.style.transform = 'scaleX(-1)';
  baby1.style.left = '158px'; baby1.style.bottom = '12.5%'; baby1.style.opacity = '0.95'; baby1.style.transform = 'scaleX(-1)';
  baby2.style.left = '168px'; baby2.style.bottom = '12%'; baby2.style.opacity = '0.95'; baby2.style.transform = 'scaleX(-1)';
  baby3.style.left = '140px'; baby3.style.bottom = '12.5%'; baby3.style.opacity = '0.95'; baby3.style.transform = 'scaleX(-1)';
  papa.style.left = '620px'; papa.style.bottom = '11%'; papa.style.opacity = '1'; papa.style.transform = 'scaleX(-1)';
  await wait(50);
  [farmer, mom, baby1, baby2, baby3, papa, basket].forEach(el => el.style.transition = '');
  await wait(50);

  // Scene 1: establish - family trapped in basket, farmer guarding, storm brewing
  caption('Rain clouds gather. Papa Rabbit\'s family sits trapped near the scarecrow.');
  await wait(1900);
  if (!stillCurrent()) return;
  say(bubbleRabbit, mom, 'Someone help us...', -10, -34);
  await wait(1700);
  if (!stillCurrent()) return;
  hideBubble(bubbleRabbit);

  // Scene 2: papa rabbit sneaks in
  hideCaption();
  await wait(300);
  caption('But hopping through the grass comes a familiar shape...');
  papa.style.left = '420px';
  await wait(1500);
  if (!stillCurrent()) return;
  say(bubbleRabbit, papa, 'Hang on, I\'m coming!', -10, -34);
  await wait(1500);
  if (!stillCurrent()) return;
  hideBubble(bubbleRabbit);

  // Scene 3: farmer spots papa
  hideCaption();
  await wait(200);
  caption('The farmer spots him and lunges to stop him!');
  farmer.style.transform = 'scaleX(-1)';
  farmer.style.left = '380px';
  await wait(1400);
  if (!stillCurrent()) return;
  say(bubbleFarmer, farmer, 'Not so fast, you!', -10, -30);
  await wait(1400);
  if (!stillCurrent()) return;
  hideBubble(bubbleFarmer);

  // Scene 4: papa dodges, farmer trips over the scarecrow's carrots
  hideCaption();
  await wait(200);
  caption('Papa Rabbit dodges left -- and the farmer trips over the carrot patch!');
  papa.style.left = '330px';
  papa.style.transform = 'scaleX(-1) translateY(-6px)';
  await wait(500);
  if (!stillCurrent()) return;
  farmer.style.transform = 'scaleX(-1) rotate(80deg)';
  farmer.style.left = '300px';
  farmer.style.bottom = '10%';
  await wait(900);
  if (!stillCurrent()) return;
  positionStars(farmer);
  stars.classList.add('show');
  say(bubbleFarmer, farmer, 'Whoaaa!!', -10, -10);
  await wait(1800);
  if (!stillCurrent()) return;
  hideBubble(bubbleFarmer);
  stars.classList.remove('show');

  // Scene 5: farmer defeated, dizzy on the ground
  hideCaption();
  await wait(200);
  caption('Down he goes! The farmer is out cold, seeing stars.');
  await wait(1900);
  if (!stillCurrent()) return;

  // Scene 6: papa frees the family
  hideCaption();
  await wait(200);
  caption('With the coast clear, Papa Rabbit springs the basket open.');
  papa.style.transform = 'scaleX(1)';
  papa.style.left = '190px';
  await wait(1400);
  if (!stillCurrent()) return;
  say(bubbleRabbit, papa, 'You\'re safe now!', -10, -34);
  mom.style.opacity = '1';
  baby1.style.opacity = '1';
  baby2.style.opacity = '1';
  baby3.style.opacity = '1';
  mom.style.left = '150px';
  baby1.style.left = '130px';
  baby2.style.left = '110px';
  baby3.style.left = '170px';
  await wait(1700);
  if (!stillCurrent()) return;
  hideBubble(bubbleRabbit);

  // Scene 7: reunited family hops away to safety
  hideCaption();
  await wait(200);
  caption('Together again, the rabbit family hops off toward home.');
  [mom, baby1, baby2, baby3, papa].forEach(el => el.style.transform = 'scaleX(1)');
  papa.style.left = '520px';
  mom.style.left = '540px';
  baby1.style.left = '500px';
  baby2.style.left = '560px';
  baby3.style.left = '480px';
  await wait(1700);
  if (!stillCurrent()) return;

  // Scene 8: end card
  hideCaption();
  await wait(400);
  fade.classList.add('on');
  await wait(1000);
  if (!stillCurrent()) return;
  caption('The rabbit family was reunited at last, safe and sound.');
  captionBar.style.zIndex = 41;
  await wait(500);
  replayBtn.classList.add('show');
}

replayBtn.addEventListener('click', () => {
  captionBar.style.zIndex = 20;
  playSequence();
});
skipBtn.addEventListener('click', () => {
  sequenceToken++;
  fade.classList.add('on');
  captionBar.style.zIndex = 41;
  setTimeout(() => {
    caption('The rabbit family was reunited at last, safe and sound.');
    replayBtn.classList.add('show');
  }, 500);
});

playSequence();
</script>
</body>
</html>
