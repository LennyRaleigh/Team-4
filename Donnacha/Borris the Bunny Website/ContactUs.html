<!DOCTYPE html>
<html>

<head>

    <!-- Sets the title shown in the browser tab -->
    <title>Contact Us</title>

    <!-- Links the Contact Us CSS file to the page -->
    <link rel="stylesheet" href="ContactUs.css">

    <!-- Loads Font Awesome so the social media icons can be used -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body>


<!-- Dropdown menu -->

<div class="dropdown">

    <!-- Button used to open the navigation menu -->
    <button class="dropbtn">▼</button>

    <!-- Contains all of the links in the navigation menu -->
    <div class="dropdown-content">

        <!-- Links to each page of the website -->
        <a href="HomePage.html">Home</a>
        <a href="AboutUs.html">About Us</a>
        <a href="ContactUs.html">Contact Us</a>
        <a href="Gameplay.html">Gameplay</a>
        <a href="Merch.html">Merch</a>

    </div>

</div>



<!-- Main page heading -->

<h1>Contact Us</h1>



<!-- Contains the image, contact form, and contact information -->

<div class="container">


    <!-- Left section containing the image -->

    <div class="left">

        <!-- Displays the Stock image -->
        <img src="Horse.jpg">

    </div>



    <!-- Middle section containing the contact form -->

    <div class="middle">

        <!-- Sends the form information to Web3Forms when submitted -->
        <form
            action="https://api.web3forms.com/submit"
            method="POST"
        >

            <!-- Hidden access key that connects the form to the Web3Forms account -->
            <input
                type="hidden"
                name="access_key"
                value="331a9e42-1ef4-4384-b704-10d392ef2a8b"
            >


            <!-- Full name field -->

            <label>Full Name</label><br>

            <!-- Allows the user to enter their name -->
            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <br><br>


            <!-- Email field -->

            <label>Email</label><br>

            <!-- Allows the user to enter their email address -->
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <br><br>


            <!-- Telephone field -->

            <label>Telephone</label><br>

            <!-- Allows the user to enter their phone number -->
            <input
                type="tel"
                name="telephone"
                placeholder="Enter your phone number"
            >


            <br><br>


            <!-- Message field -->

            <label>Message</label><br>

            <!-- Allows the user to type their message -->
            <textarea
                name="message"
                placeholder="Type your message"
                required
            ></textarea>


            <br><br>


            <!-- Sends the completed form to Web3Forms -->
            <input
                type="submit"
                value="Contact Us"
            >

        </form>

    </div>



    <!-- Right section containing contact details -->

    <div class="right">

        <!-- Displays the contact email heading -->
        <h2>Email</h2>

        <!-- Displays the contact email address -->
        <p>BorrisTheBunny@gmail.com</p>


        <!-- Displays the location heading -->
        <h2>Location</h2>

        <!-- Displays the company location -->
        <p>Pleasent Park, Silicon Valley</p>



        <!-- Contains the social media icons -->

        <div class="icons">


            <!-- First row of social media icons -->

            <div class="icon-row">

                <!-- Facebook icon -->
                <a
                    href="#"
                    class="fa fa-facebook"
                ></a>

                <!-- Instagram icon -->
                <a
                    href="#"
                    class="fa fa-instagram"
                ></a>

            </div>


            <!-- Second row of social media icons -->

            <div class="icon-row">

                <!-- LinkedIn icon -->
                <a
                    href="#"
                    class="fa fa-linkedin"
                ></a>

            </div>


        </div>

    </div>


</div>


</body>

</html>
